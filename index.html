*{box-sizing:border-box}body{margin:0;background:#eef3ef;color:#172b25;font:16px/1.55 system-ui,sans-serif}header{background:#123d2c;color:white;padding:36px max(5vw,20px)}h1{font-size:clamp(28px,5vw,48px);margin:8px 0}h2,h3{line-height:1.25}small,.muted{color:#62766a}header small{color:#b9e6a9}.shell{max-width:1100px;margin:auto;padding:24px;display:grid;grid-template-columns:230px 1fr;gap:24px}aside,article{background:white;border:1px solid #d5e2d8;border-radius:18px;padding:22px}aside{align-self:start;position:sticky;top:12px}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #cbdacf;border-radius:10px;padding:12px;background:white;color:#173d2c;text-align:left}button:hover{background:#edf7e9}button:disabled{opacity:.45;cursor:default}.primary{background:#238500;color:white;border:0;font-weight:700}.primary:hover{background:#196900}nav button{width:100%;margin:5px 0}nav button.active{background:#d9efce;border-color:#238500;font-weight:700}.bar{height:10px;background:#dce8de;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#238500}.tag{font-size:12px;font-weight:800;letter-spacing:1.4px;color:#238500}.prompt{font-size:22px;font-weight:650;margin:16px 0}.clue{background:#e9f4e5;border-left:5px solid #238500;padding:18px;border-radius:8px;margin:12px 0}.options{display:grid;gap:10px}.options button.selected{border:2px solid #238500;background:#e9f4e5}.feedback{padding:14px;border-radius:10px;background:#fff1dc;margin:14px 0}.good{background:#e0f2db}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}input[type=text],textarea{width:100%;padding:12px;border:1px solid #aebfb2;border-radius:8px}details{margin:14px 0}summary{cursor:pointer;color:#237324;font-weight:700}.formula{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.formula span{padding:5px 9px;border-radius:5px;background:#e1efda}.formula span:nth-child(2){background:#dbe9ff}.formula span:nth-child(3){background:#ffecd0}.funnel div{margin:5px auto;padding:8px;text-align:center;color:white;font-weight:700;clip-path:polygon(0 0,100% 0,94% 100%,6% 100%)}.check{display:block;margin:12px 0}footer{padding:20px;text-align:center;color:#62766a}@media(max-width:700px){.shell{display:block;padding:12px}aside{position:static;margin-bottom:12px}nav{display:grid;grid-template-columns:1fr 1fr}article{padding:16px}}@media print{aside,.actions,header{display:none}.shell{display:block}}
</style><header><small>COMMUNICATION TRAINING LAB / A2+–B1 / 60 MIN</small><h1>Ask better questions.</h1><div>Build accurate questions. Follow the evidence. Confirm before you act.</div></header><div class="shell"><aside><div class="tag">YOUR PROGRESS</div><h2 id="score"></h2><div class="bar"><i id="bar"></i></div><p class="muted" id="attempt"></p><nav id="nav"></nav><button onclick="exportWork()">Download results</button></aside><article id="main"></article></div><footer>Independent practice · No partner required · ELSA requires internet access</footer><script>
const data=[[{"p": "___ the transaction still pending?", "a": "Is", "e": "Use BE before the subject to ask about a current state."}, {"p": "When ___ you first notice the issue yesterday?", "a": "did", "e": "Past simple questions use did + base verb."}, {"p": "How often ___ your sister check her account?", "a": "does", "e": "Third-person singular requires does; check stays in base form."}, {"p": "Could you tell me where the receipt ___?", "a": "is", "e": "Embedded questions use statement order: the receipt is."}, {"p": "What ___ after you pressed Submit? (happen)", "a": "happened", "e": "What is the subject, so no did is needed in a neutral question."}, {"p": "___ you received a confirmation email yet?", "a": "Have", "e": "Present perfect: have + subject + past participle."}, {"p": "Reorder: working / your / is / microphone / properly", "a": "Is your microphone working properly", "e": "BE precedes the subject."}, {"p": "Reorder: why / cancel / did / your / you / appointment", "a": "Why did you cancel your appointment", "e": "WH + did + subject + base verb."}, {"p": "Reorder: tell / where / could / me / you / lives / he", "a": "Could you tell me where he lives", "e": "The embedded clause uses subject + verb."}, {"p": "Reorder: caused / what / delay / the", "a": "What caused the delay", "e": "What is the subject of caused."}, {"p": "Reorder: been / how long / waiting / have / you", "a": "How long have you been waiting", "e": "Present perfect progressive: have + subject + been + -ing."}, {"p": "Reorder: when / were / doing / you / what / it / happened", "a": "What were you doing when it happened", "e": "Past progressive uses were + subject + -ing."}, {"p": "Repair: Where you usually goes after work?", "a": "Where do you usually go after work", "e": "Add do and use the base verb go."}, {"p": "Repair: Did she received the package?", "a": "Did she receive the package", "e": "Did already carries past tense."}, {"p": "Repair: Does your account is active?", "a": "Is your account active", "e": "BE does not need do-support."}, {"p": "Repair: Could you to explains what happened?", "a": "Could you explain what happened", "e": "After could, use the base verb without to."}, {"p": "Repair: Could you tell me why did the payment failed?", "a": "Could you tell me why the payment failed", "e": "Remove did and use statement order with failed."}, {"p": "Repair: Who did sent the message?", "a": "Who sent the message", "e": "Neutral subject questions do not use did here."}, {"p": "Make polite using “Could you tell me”: Where is the nearest branch?", "a": "Could you tell me where the nearest branch is", "e": "Move is after the subject in the embedded clause."}, {"p": "Make polite using “Could you tell me”: When did the issue start?", "a": "Could you tell me when the issue started", "e": "Remove did; start becomes started."}, {"p": "Make polite using “Could you tell me”: Does the card work online?", "a": ["Could you tell me if the card works online", "Could you tell me whether the card works online"], "e": "Use if/whether and statement order; works agrees with card."}, {"p": "Make polite using “Could you tell me”: What caused the error?", "a": "Could you tell me what caused the error", "e": "Subject-question order remains unchanged."}], [{"p": "Customer: “My internet disconnects during work calls.” Choose the most useful next question.", "o": ["What is your problem?", "Does it also disconnect when you use other applications?", "Would you like to cancel your plan?"], "c": 1, "e": "Narrow the conditions instead of repeating the issue or jumping to a solution."}, {"p": "Customer: “It freezes.” Which question clarifies the meaning?", "o": ["When you say freezes, does the screen stop responding or does the app close?", "Is your account active?", "Why did you break it?"], "c": 0, "e": "Clarify an ambiguous word using observable alternatives."}, {"p": "Which question is grammatically correct AND polite?", "o": ["Could you tell me where does the error appear?", "Could you tell me where the error appears?", "Could you to tell me where the error appears?"], "c": 1, "e": "Embedded clauses use statement order; could takes a base verb."}, {"p": "Customer: “I already restarted the device twice.” What should you ask?", "o": ["Have you restarted it?", "What happened after the second restart?", "Can I close the case?"], "c": 1, "e": "Build on information already provided."}, {"p": "You know the error started yesterday and occurs only on a laptop. Choose a confirmation.", "o": ["So, the error started yesterday and only affects your laptop, correct?", "So, your laptop is broken, correct?", "When did the error start?"], "c": 0, "e": "Confirm established facts, not an unverified diagnosis."}, {"p": "Which is an EXPLORE question?", "o": ["Is the payment pending?", "Could you walk me through what happened?", "So, it happened yesterday, correct?"], "c": 1, "e": "Explore invites a broad explanation."}, {"p": "Which question contains an unsupported assumption?", "o": ["When did you notice the charge?", "What does the merchant name say?", "Why did someone steal your card?"], "c": 2, "e": "The charge has not been established as theft."}, {"p": "Customer: “I cannot sign in.” You need to establish a specific fact.", "o": ["What happened?", "Are you seeing an error message?", "So everything is fixed, right?"], "c": 1, "e": "A closed question narrows the problem."}], [{"p": "EXPLORE · Choose your next question", "clue": "I cannot find my backpack. I had it earlier today.", "o": ["Did you leave it at the gym?", "Could you walk me through your day?", "Is it black?"], "c": 1, "e": "Start broad; the location is unknown.", "write": "Build: could / tell / me / you / what / happened", "wa": "Could you tell me what happened", "we": "Use a modal opening and a subject question."}, {"p": "NARROW · Choose your next question", "clue": "I went to a café, the gym and a supermarket, in that order. I remember having it at the café.", "o": ["When did you last see it?", "Why did you lose it?", "What is your problem?"], "c": 0, "e": "Establish the last confirmed sighting.", "write": "Ask whether they took it into the gym. Use DID and “your backpack”.", "wa": "Did you take your backpack into the gym", "we": "Did + subject + base verb."}, {"p": "CLARIFY · Choose your next question", "clue": "I took it into the gym. I left in a hurry. Someone found a black backpack there, but mine is dark blue.", "o": ["So the black backpack is yours?", "Could you describe any other identifying features?", "Did you visit a café?"], "c": 1, "e": "Color alone is insufficient to identify the bag.", "write": "Make polite: What is inside your backpack? Use “Could you tell me”.", "wa": "Could you tell me what is inside your backpack", "we": "What is the subject; retain its order."}, {"p": "CONFIRM · Choose your next question", "clue": "Mine contains a laptop and has a red keychain. Nobody has checked the found bag yet.", "o": ["So your bag was last seen at the gym, but the found bag has not been identified, correct?", "So the gym definitely has your bag?", "Why did you go to the gym?"], "c": 0, "e": "Separate known facts from uncertainty.", "write": "Build: the / has / found / been / identified / bag / yet", "wa": "Has the found bag been identified yet", "we": "Present perfect passive question."}, {"p": "Choose the safest conclusion.", "o": ["The gym definitely has the bag.", "The gym is a reasonable lead; ask staff to verify the keychain and contents.", "The bag was stolen at the supermarket."], "c": 1, "e": "The last sighting supports a lead, not certainty."}], [{"p": "EXPLORE · Choose your next question", "clue": "I found a charge I do not recognize on my credit card. I am worried.", "o": ["Could you tell me more about the transaction you noticed?", "Did someone steal your card?", "Would you like a refund now?"], "c": 0, "e": "Explore without assuming fraud.", "write": "Build: could / describe / you / what / noticed / you", "wa": "Could you describe what you noticed", "we": "Embedded object question uses subject + verb."}, {"p": "NARROW · Choose your next question", "clue": "It is $89.99 from STREAMPLUS DIGITAL. I noticed it this morning.", "o": ["How much was it?", "Is the transaction pending or posted?", "Why did you subscribe?"], "c": 1, "e": "The amount is already known; status is missing.", "write": "Ask when the transaction appeared. Use DID.", "wa": "When did the transaction appear", "we": "WH + did + subject + base verb."}, {"p": "CLARIFY · Choose your next question", "clue": "It appeared yesterday and is pending. I signed up for a streaming trial two weeks ago.", "o": ["Could you tell me whether you canceled the trial?", "So it is definitely fraud?", "How much was the charge?"], "c": 0, "e": "Investigate the new subscription clue.", "write": "Make polite: Did you receive a cancellation email? Use “Could you tell me”.", "wa": ["Could you tell me if you received a cancellation email", "Could you tell me whether you received a cancellation email"], "we": "Use if/whether and past statement order."}, {"p": "CONFIRM · Choose your next question", "clue": "I cannot remember canceling it. I still have my card and have not contacted the merchant.", "o": ["So the charge is pending and may be related to a trial, but you have not verified that, correct?", "So the merchant stole your money?", "So your refund is guaranteed?"], "c": 0, "e": "Confirm facts and explicitly preserve uncertainty.", "write": "Build: you / have / contacted / the / merchant / yet", "wa": "Have you contacted the merchant yet", "we": "Have + subject + past participle."}, {"p": "Which next step is appropriate?", "o": ["Guarantee an immediate refund.", "Explain that the charge needs verification and follow the relevant card-issuer process.", "Tell the customer to ignore it."], "c": 1, "e": "Do not promise an outcome or dismiss a potentially unauthorized charge."}]];const names=['Question Architecture','Question Detective','Everyday Investigation','Customer Service Investigation','Question Pronunciation Lab'];const times=[15,10,10,10,15];let state={s:0,i:[0,0,0,0],r:{},notes:{},checks:{}};try{let x=JSON.parse(localStorage.getItem('inquiryLabV3'));if(x)state=x}catch(e){};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=s=>s.toLowerCase().trim().replace(/[?.!,]/g,'').replace(/\s+/g,' ');const total=data.flat().reduce((n,q)=>n+1+(q.write?1:0),0);function save(){try{localStorage.setItem('inquiryLabV3',JSON.stringify(state))}catch(e){}stats()}function stats(){let r=Object.values(state.r);$('score').textContent=r.filter(x=>x.ok).length+' / '+total+' mastered';$('bar').style.width=100*r.filter(x=>x.ok).length/total+'%';$('attempt').textContent=r.filter(x=>x.first).length+' correct on first attempt';}function go(s){state.s=s;save();render()}function ref(){return `<details><summary>Grammar toolkit · six structures</summary>${[['BE','Am / Is / Are','subject','complement'],['DO','Do / Does / Did','subject','base verb'],['MODAL','Can / Could','subject','base verb'],['WH','WH + auxiliary','subject','main verb'],['SUBJECT','Who / What','verb','(complement)'],['EMBEDDED','Could you tell me + WH','subject','verb']].map(x=>`<b>${x[0]}</b><div class="formula">${x.slice(1).map(y=>`<span>${y}</span>`).join(' + ')}</div>`).join('')}<p>For embedded yes/no questions, use if or whether + statement order.</p></details>`}function funnel(){return '<div class="funnel">'+['EXPLORE · broad','NARROW · facts','CLARIFY · follow-up','CONFIRM · understanding'].map((x,i)=>`<div style="width:${100-i*12}%;background:${['#238500','#36991a','#478d31','#567c42'][i]}">${x}</div>`).join('')+'</div>'}function render(){let s=state.s;$('nav').innerHTML=names.map((n,i)=>`<button class="${i===s?'active':''}" onclick="go(${i})">0${i+1} · ${n}<br><small>${times[i]} min</small></button>`).join('');stats();if(s===4){speaking();return}let i=state.i[s],q=data[s][i],k=s+'-'+i;let r=state.r[k]||{},w=state.r[k+'w']||{};let history=s>=2?data[s].slice(0,i).filter(x=>x.clue).map(x=>`<div class="clue">${esc(x.clue)}</div>`).join(''):'';$('main').innerHTML=`<div class="tag">MISSION 0${s+1} · ${times[s]} MIN · ${i+1}/${data[s].length}</div><h2>${names[s]}</h2>${s===0?ref():s>=2?`<details><summary>Review the question funnel</summary>${funnel()}</details><details><summary>Previous clues</summary>${history||'No previous clues yet.'}</details>`:''}${q.clue?`<div class="clue"><small>${s===2?'FRIEND':'CUSTOMER'} · NEW INFORMATION</small><br>${esc(q.clue)}</div>`:''}<div class="prompt">${esc(q.p)}</div>${q.o?`<div class="options">${q.o.map((o,j)=>`<button class="${r.v===j?'selected':''}" onclick="choose(${j})">${esc(o)}</button>`).join('')}</div>`:`<input id="answer" type="text" autocomplete="off" value="${esc(r.v||'')}" placeholder="Type your answer" onkeydown="if(event.key==='Enter')check(false)"><div class="actions"><button class="primary" onclick="check(false)">Check answer</button></div>`}${feedback(r,q.e,q.o?q.o[q.c]:q.a)}${q.write&&r.ok?`<hr><div class="tag">PRODUCE THE QUESTION</div><p>${esc(q.write)}</p><input id="written" type="text" value="${esc(w.v||'')}" onkeydown="if(event.key==='Enter')check(true)"><div class="actions"><button class="primary" onclick="check(true)">Check question</button></div>${feedback(w,q.we,q.wa)}`:''}<div class="actions"><button onclick="move(-1)" ${i===0?'disabled':''}>Previous</button><button class="primary" onclick="move(1)" ${r.ok&&(!q.write||w.ok)?'':'disabled'}>${i===data[s].length-1?'Finish mission':'Next challenge →'}</button></div>`}function feedback(r,e,a){if(!r.n)return '';return `<div class="feedback ${r.ok?'good':''}"><b>${r.ok?'Correct!':'Try again.'}</b> ${esc(e)}${!r.ok&&r.n>=2?`<p>Model answer: ${esc(Array.isArray(a)?a.join(' / '):a)}. Enter it to continue.</p>`:''}</div>`}function record(k,v,ok){let old=state.r[k]||{};state.r[k]={v,ok,n:(old.n||0)+1,first:old.n?old.first:ok};save();render()}function choose(j){let s=state.s,i=state.i[s];record(s+'-'+i,j,j===data[s][i].c)}function check(w){let s=state.s,i=state.i[s],q=data[s][i],v=$(w?'written':'answer').value;if(!v.trim())return;let a=w?q.wa:q.a;record(s+'-'+i+(w?'w':''),v,[a].flat().some(x=>norm(x)===norm(v)))}function move(d){let s=state.s,i=state.i[s]+d;if(i>=data[s].length){go(s+1);return}state.i[s]=Math.max(0,i);save();render()}const tasks=['Read all 16 questions aloud','Review pronunciation feedback','Practice difficult words and questions again','Record a second attempt'];const reading=[['Yes/no questions',['Is your account still active?','Did you receive the confirmation email?','Have you checked your recent transactions?','Were you using the application when the error occurred?']],['WH and subject questions',['When did you first notice the problem?','How long have you been waiting for a response?','What were you doing when the connection failed?','Who authorized the transaction?']],['Polite and embedded questions',['Could you explain what happened after the restart?','Could you tell me where the nearest branch is?','Could you confirm whether the payment has been processed?','Would you mind explaining how you normally access your account?']],['Follow-up and confirmation questions',['When you say the screen freezes, what exactly happens?','Does the issue occur on other devices as well?','What happened after you contacted the merchant?','So the charge is still pending, is that correct?']]];function speaking(){$('main').innerHTML=`<div class="tag">MISSION 05 · 15 MIN · FLUENT USE</div><h2>Question Pronunciation Lab</h2><div class="clue">Practice asking questions clearly and naturally. Read the questions aloud to ELSA Speech Analyzer. No role-play or customer responses are required.</div><p><b>01 · Prepare · 3 min.</b> Read the questions silently, then practice aloud. Focus on complete words, sentence stress and smooth linking. Yes/no questions often rise at the end; WH questions often fall. Intonation can vary with context.</p><p><b>02 · Record · 4 min.</b> Open <a href="https://speechanalyzer.elsaspeak.com/" target="_blank" rel="noopener">ELSA Speech Analyzer</a>. Read all 16 questions in order at a natural pace. Pause briefly between questions. Do not read the section headings.</p>${reading.map(([title,qs],i)=>`<div class="clue"><div class="tag">${title}</div><ol start="${i*4+1}">${qs.map(q=>`<li style="margin:10px 0">${esc(q)}</li>`).join('')}</ol></div>`).join('')}<p><b>03 · Review and retry · 5 min.</b> Review the available pronunciation feedback. Identify three difficult words or phrases, practice them in their full questions, then record the questions again.</p>${['Three difficult words or phrases','What improved in your second attempt?'].map(t=>`<label>${t}<textarea oninput="note('${t}',this.value)">${esc(state.notes[t])}</textarea></label>`).join('')}${tasks.map((t,i)=>`<label class="check"><input type="checkbox" ${state.checks['pron'+i]?'checked':''} onchange="state.checks['pron'+${i}]=this.checked;save()"> ${t}</label>`).join('')}<p><b>04 · Submit · 3 min.</b> Download your results and submit them with a screenshot of your final ELSA pronunciation feedback.</p><button class="primary" onclick="exportWork()">Download results</button><p class="muted">Pronunciation is assessed separately in ELSA and is not included in the HTML automatic score.</p>`}function note(k,v){state.notes[k]=v;save()}function exportWork(){let lines=['Effective Inquiry Lab', $('score').textContent,$('attempt').textContent];data.forEach((arr,s)=>{lines.push('\n'+names[s]);arr.forEach((q,i)=>{let k=s+'-'+i,r=state.r[k];lines.push(q.p+' | '+(r?(q.o?q.o[r.v]:r.v)+' | '+(r.ok?'Correct':'Retry needed'):'Not attempted'));if(q.write)lines.push(q.write+' | '+(state.r[k+'w']?.v||'Not attempted'))})});lines.push('\nELSA reflection',JSON.stringify(state.notes,null,2),...tasks.map((t,i)=>(state.checks['pron'+i]?'[x] ':'[ ] ')+t));let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain'}));a.download='Inquiry_Lab_Results.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}render();</script></html>
